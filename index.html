.check input:checked ~ div b{text-decoration:line-through;color:var(--muted)}

footer{margin-top:44px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const chips=document.getElementById("chips"), root=document.getElementById("stops");

function addChip(id,label,small,cvar){
  const b=document.createElement("button");
  b.className="chip"; b.type="button"; b.style.setProperty("--c",`var(${cvar})`);
  b.innerHTML=`<i></i>${esc(label)}${small?`<small>${esc(small)}</small>`:""}`;
  b.addEventListener("click",()=>document.getElementById(id).scrollIntoView({behavior:"smooth",block:"start"}));
  chips.appendChild(b);
}
addChip("prep","行前準備","","--accent");

STOPS.forEach(st=>{
  addChip(st.id,st.name,st.range.split(" – ")[0],st.c);
  const sec=document.createElement("section");
  sec.className="stop"; sec.id=st.id;
  sec.style.setProperty("--c",`var(${st.c})`); sec.style.setProperty("--c-soft",`var(${st.s})`);
  const stayLink=n=>`<a href="${MAP(n)}">${esc(n)}</a>`;
  const days=st.days.map(x=>{
    const slots=[["早上",x.m],["下午",x.a],["晚上",x.e]].filter(p=>p[1]).map(p=>`<div class="slot"><dt>${p[0]}</dt><dd>${esc(p[1])}</dd></div>`).join("");
    const places=x.p?`<ul class="places">${x.p.map(p=>`<li><a href="${MAP(p[2]||(p[0].replace(/（.*?）/g,"")+" "+p[1]))}">${esc(p[0])}</a><span>${esc(p[1])}</span></li>`).join("")}</ul>`:"";
    const stayHtml=x.stay?(x.stay==="機上"||x.stay==="郵輪"?esc(x.stay):stayLink(x.stay)):"";
    return `<article class="day">
      <div class="date"><span class="md">${esc(x.d)}</span><span class="wd">週${esc(x.w)}</span></div>
      <div class="body">
        <div class="tag">${esc(x.note)}</div>
        <dl class="slots">${slots}</dl>
        ${x.tip?`<div class="tip">${esc(x.tip)}</div>`:""}
        ${places}
        ${x.stay?`<div class="lodge"><span>住宿</span><b>${stayHtml}</b></div>`:""}
      </div></article>`;
  }).join("");
  const info=st.info?`<dl class="info">${(st.stay?[["住宿",null]]:[]).concat(st.info).map(r=>r[1]===null?`<div><dt>住宿</dt><dd><b><a href="${MAP(st.stay)}">${esc(st.stay)}</a></b></dd></div>`:`<div><dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd></div>`).join("")}</dl>`:"";
  sec.innerHTML=`<div class="stop-head"><h2>${esc(st.name)}</h2><span class="range">${esc(st.range)}</span>${info}</div><div class="days">${days}</div>`;
  root.appendChild(sec);
});

/* checklist, remembered per browser */
let saved={};
try{saved=JSON.parse(localStorage.getItem("nordic-prep-v1")||"{}")||{}}catch(e){saved={}}
const groups=document.getElementById("groups"), prog=document.getElementById("prog");
let total=0;
PREP.forEach((g,gi)=>{
  const box=document.createElement("div"); box.className="group";
  box.innerHTML=`<h3>${esc(g.t)}</h3>`+g.items.map((it,ii)=>{
    total++; const id=`p${gi}_${ii}`;
    return `<label class="check"><input type="checkbox" id="${id}" ${saved[id]?"checked":""}><div><b>${esc(it[0])}</b><small>${esc(it[1])}</small></div></label>`;
  }).join("");
  groups.appendChild(box);
});
function refresh(){
  const n=groups.querySelectorAll("input:checked").length;
  prog.textContent=`已完成 ${n} / ${total}`;
}
groups.addEventListener("change",e=>{
  saved[e.target.id]=e.target.checked;
  try{localStorage.setItem("nordic-prep-v1",JSON.stringify(saved))}catch(err){}
  refresh();
});
refresh();

(function(){
  const now=new Date(), t=new Date(2026,9,23);
  const days=Math.ceil((t-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/86400000);
  document.getElementById("cd").textContent=days>0?days:(days===0?"今天":"已");
})();
</script>
